{{- if .Values.glpi.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: glpi-cronjob
  namespace: {{ include "glpi.namespace" . }}
  labels:
    {{- include "glpi.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.glpi.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1 
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "glpi.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.glpi.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            # En una instalación nueva, este CronJob puede empezar a correr
            # (schedule cada 2 min) antes de que el Job post-install
            # glpi-db-install/glpi-db-configure termine de escribir
            # /etc/glpi/config/config_db.php -- ese Job corre como Helm hook
            # (post-install, hook-weight 10/20), pero el CronJob es un
            # recurso normal que se crea en la misma fase de Sync que
            # nginx/php-fpm, sin esperar a los hooks. Sin esta guarda,
            # cron.php falla contra una base sin configurar hasta que el
            # hook termina -- mismo patrón wait-for-mariadb que ya usan
            # glpi-db-install/glpi-db-configure/mariadb-timezone, aplicado
            # acá a la precondición real de este Job (el archivo de config,
            # no la conectividad TCP a la DB).
            - name: wait-for-config-db
              image: busybox:1.36.1
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
              command:
                - sh
                - -c
                - until [ -f /etc/glpi/config/config_db.php ]; do sleep 2; done
              volumeMounts:
                - name: etc
                  mountPath: /etc/glpi
              resources:
                limits:
                  cpu: 100m
                  memory: 64Mi
                requests:
                  cpu: 50m
                  memory: 32Mi
          containers:
            - image: {{ include "glpi.phpfpm.image" . }}
              imagePullPolicy: {{ .Values.glpi.phpfpm.image.pullPolicy }}
              name: base
              {{- with .Values.glpi.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              envFrom: 
                - configMapRef: 
                    name: glpi-config
                - secretRef: 
                    name: {{ include "glpi.databaseSecretName" . }}
              command: 
                - php
                - front/cron.php
              volumeMounts:
                - name: files 
                  mountPath: /var/lib/glpi
                - name: marketplace
                  mountPath: /var/www/html/marketplace
                - name: etc 
                  mountPath: /etc/glpi
                {{- if .Values.glpi.securityContext.readOnlyRootFilesystem }}
                - name: tmp
                  mountPath: /tmp
                {{- end }}
              resources:
                {{- toYaml .Values.glpi.phpfpm.resources | nindent 16 }}
          volumes: 
            - name: etc
              persistentVolumeClaim:
                claimName: glpi-etc
            - name: files
              persistentVolumeClaim:
                claimName: glpi-files
            - name: marketplace
              persistentVolumeClaim:
                claimName: glpi-marketplace
            {{- if .Values.glpi.securityContext.readOnlyRootFilesystem }}
            - name: tmp
              emptyDir: {}
            {{- end }}
          restartPolicy: OnFailure
{{- end }}
